# ==============================================================================
# MonoTransfer — Render Blueprint Specification (render.yaml)
# ==============================================================================
# Use this Blueprint to automatically provision all services on Render with 1 click.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: monotransfer-postgres
    databaseName: monotransfer
    user: monotransfer
    plan: free

services:
  # 1. Internal Redis (Queue & WebSocket Pub/Sub)
  - type: redis
    name: monotransfer-redis
    ipAllowList: [] # internal access only
    plan: free

  # 2. Python ytmusicapi Microservice
  - type: web
    name: monotransfer-ytmusic
    runtime: python
    rootDir: ytmusic-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

  # 3. Next.js Web Application & Unified Runner
  - type: web
    name: monotransfer-web
    runtime: node
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start:all
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: monotransfer-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: monotransfer-redis
          property: connectionString
      - key: YTMUSIC_SERVICE_URL
        fromService:
          type: web
          name: monotransfer-ytmusic
          property: host
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
